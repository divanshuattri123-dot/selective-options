name: cloud-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Install locked runtime and validation tools
        run: |
          python -m pip install -r requirements.lock -r ci/requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Restore checksum-verified private historical evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/restore_github_evidence.py
      - name: Validate portable offline build
        if: ${{ always() && !cancelled() }}
        run: python tools/cloud_validate.py --output state/cloud-validation
      - name: Publish readable build summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          source = Path("state/cloud-validation/summary.json")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as destination:
              if not source.is_file():
                  destination.write("Cloud validation report is missing. This run did not establish a valid build.\n")
              else:
                  report = json.loads(source.read_text(encoding="utf-8"))
                  selection = report.get("test_selection", {})
                  counts = report.get("test_counts", {})
                  destination.write(f"Cloud build: **{report['status']}**\n\n")
                  destination.write(f"Commit: `{report.get('git_commit')}`\n\n")
                  destination.write(f"Platform: {report['platform']}; Python {report['python_version']}\n\n")
                  destination.write(f"Collected: {selection.get('collected_count', 'unavailable')}; selected: {len(selection.get('selected_nodeids', []))}; explicit historical exclusions: {len(selection.get('excluded', []))}.\n\n")
                  destination.write(f"Tests: {counts.get('tests', 'unavailable')}; failures: {counts.get('failures', 'unavailable')}; errors: {counts.get('errors', 'unavailable')}; skips: {counts.get('skipped', 'unavailable')}.\n\n")
                  destination.write("Trading remains disabled. No market-data capture runs in this workflow.\n\n")
                  destination.write("Download the cloud-build artifact for exact selected cases, exclusion reasons, checksums, JUnit, step logs and the installed-wheel checks. The preserved Windows workflow remains the full historical proof authority. Artifact retention: 14 days.\n")
          PY
      - name: Retain build and scope reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-build-${{ github.sha }}
          path: state/cloud-validation/
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Build and exercise isolated container
        run: |
          mkdir -p state/cloud-container
          task_image="selective-options-cloud:${GITHUB_SHA}"
          task_volume="selective-options-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$task_image" . > state/cloud-container/build.log 2>&1
          docker inspect --format '{{.Id}}' "$task_image" > state/cloud-container/image-id.txt
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$task_image" check-config > state/cloud-container/config.json
          docker volume create "$task_volume"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --mount "type=volume,src=${task_volume},dst=/app/state" --entrypoint python "$task_image" -c 'from pathlib import Path; import os; assert os.getuid() == 10001; Path("/app/state/ci-persistence.txt").write_text("cloud-volume-test", encoding="utf-8")'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --mount "type=volume,src=${task_volume},dst=/app/state" --entrypoint python "$task_image" -c 'from pathlib import Path; import os,json; assert Path("/app/state/ci-persistence.txt").read_text() == "cloud-volume-test"; print(json.dumps({"uid":os.getuid(),"storage_persisted":True}))' > state/cloud-container/storage.json
          if docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$task_image" arm > state/cloud-container/arming-refusal.log 2>&1; then
            printf 'Unexpected live arming success\n' >&2
            exit 1
          else
            task_arm_exit=$?
            test "$task_arm_exit" -eq 2
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("state/cloud-container")
          config = json.loads((root / "config.json").read_text())
          storage = json.loads((root / "storage.json").read_text())
          refusal = (root / "arming-refusal.log").read_text()
          assert config["config"] == "VALID" and config["mode"] == "testnet"
          assert config["trading_enabled"] is False
          assert storage == {"uid": 10001, "storage_persisted": True}
          assert "MILESTONE_INCOMPLETE" in refusal and "trading_enabled=false" in refusal
          report = {
              "status": "PASSED", "git_commit": os.environ["GITHUB_SHA"],
              "image_id": (root / "image-id.txt").read_text().strip(),
              "dockerfile_sha256": hashlib.sha256(Path("Dockerfile").read_bytes()).hexdigest(),
              "config": config, "storage": storage, "arm_exit_code": 2,
              "trading_enabled": False, "container_runtime_network": "none",
              "scope": "finite non-root container smoke and two-container named-volume persistence; no collector soak",
          }
          (root / "summary.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
          docker volume rm "$task_volume"
      - name: Publish container job summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path("state/cloud-container/summary.json")
          report = json.loads(report_path.read_text()) if report_path.is_file() else {"status":"FAILED_OR_INCOMPLETE"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Container verification\n\n")
              summary.write(f"Result: {report['status']}\n\nCommit: `{os.environ['GITHUB_SHA']}`\n\n")
              summary.write("Checks: testnet configuration, UID 10001, writable named-volume state across two containers, mandatory arming refusal. Runtime network disabled. This finite check does not certify collector continuity. Artifacts retained 14 days.\n")
          PY
      - name: Retain container diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-container-${{ github.sha }}
          path: state/cloud-container/
          if-no-files-found: error
          retention-days: 14

services:
  probe:
    build: .
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    volumes:
      - probe-state:/app/state
    # One-shot public readiness. No background trading process or secret injection.
    command: ["probe", "--output", "/app/state/probe.json"]
volumes:
  probe-state:
